    SaleRequirement:
      description: |-
        A condition for the sale. Fields present depend on `type`:
        - `purchased_packages`: `packages` and `match` (always `all`). `packages` is empty if every required package is hidden.
        - `lifetime_spend`: `amount` and `currency`.
        - `minimum_basket_value`: `amount` and `currency`.
      example:
        amount: 50
        match: all
        currency: USD
        type: lifetime_spend
        packages:
        - name: GIFTCARD
          id: 28
        - name: GIFTCARD
          id: 28
      properties:
        type:
          description: The type of requirement for the sale. Additional requirement
            types may be added later. Clients must ignore requirement types they do
            not know.
          enum:
          - purchased_packages
          - lifetime_spend
          - minimum_basket_value
          example: lifetime_spend
          type: string
        packages:
          description: Packages the customer must have purchased. Present for `purchased_packages`.
          items:
            $ref: '#/components/schemas/SaleReference'
          type: array
        match:
          description: Present for `purchased_packages`. Always `all`.
          enum:
          - all
          type: string
        amount:
          description: Present for `lifetime_spend` and `minimum_basket_value`.
          example: 50
          type: number
        currency:
          description: Present for `lifetime_spend` and `minimum_basket_value`. The
            store currency.
          example: USD
          type: string
      required:
      - type
