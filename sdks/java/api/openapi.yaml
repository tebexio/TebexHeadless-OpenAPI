  /top-customers:
    get:
      description: |-
        Gets the customer who spent the most in the given period. This does not depend on the sidebar's Top Customer module being configured.

        Requires basic auth: the username is the webstore identifier and the password is the account's checkout API key.

        - `total` is in the account's currency, net of tax, and matches the revenue statistics in the control panel.
        - Free, manual, zero-price and incomplete payments are never counted.
        - Responses are cached for 10 minutes.
        - If there is no top customer for the period, `data` is null.
      operationId: getTopCustomer
      parameters:
      - description: The period to rank customers over. `none` covers all time.
        explode: true
        in: query
        name: period
        required: false
        schema:
          default: monthly
          enum:
          - hourly
          - daily
          - weekly
          - monthly
          - yearly
          - none
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                customer:
                  summary: Top customer this month
                  value:
                    data:
                      username: George_Peel
                      username_id: "15413447"
                      avatar_url: https://forum.cfx.re/user_avatar/forum.cfx.re/george_peel/256/4582854_2.png
                      total: 21.99
                      currency: USD
                      period: monthly
                empty:
                  summary: No top customer
                  value:
                    data: null
              schema:
                $ref: '#/components/schemas/TopCustomerResponse'
          description: "Successful response returns the top customer, or null."
      security:
      - basicAuth: []
      summary: Get the webstore's top customer.
      tags:
      - Headless
      x-accepts:
      - application/json
