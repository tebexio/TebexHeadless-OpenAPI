  /{basketIdent}/packages:
    post:
      description: |-
        Add a package to the basket by its `ident` or numeric ID.

        - Using `ident` is recommended, since it works for every package type. It is required for external packages.
        - Numeric IDs still work for standard packages.

        To add a package belonging to a dynamic category, set `dynamic` to `true`. Without this property the API will treat the request as a normal package ID.
      operationId: addBasketPackage
      parameters:
      - $ref: '#/components/parameters/basketIdent'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/addBasketPackage_request'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasketResponse'
          description: Successful response.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The ident is unknown or does not match a package in this store
            ("The selected id is invalid.").
        "422":
          description: The provided request is invalid. The error response will include
            detail as to which parameter failed validation. A malformed `package_id`
            fails with "package_id must be a package ID or ident."
      summary: Add package to basket
      tags:
      - Baskets
      x-content-type: application/json
      x-accepts:
      - application/json
    servers:
    - description: "Basket-only API, account token not required"
      url: https://headless.tebex.io/api/baskets
  /{basketIdent}/packages/remove:
    post:
      description: |-
        Remove a package from the basket by its `ident` or numeric ID.

        - Using `ident` is recommended, since it works for every package type. Send it back exactly as returned; don't build or parse it.
        - Numeric IDs still work for standard packages.
      operationId: removeBasketPackage
      parameters:
      - $ref: '#/components/parameters/basketIdent'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/removeBasketPackage_request'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasketResponse'
          description: Successful response returns the basket.
        "422":
          description: The provided request is invalid. The error response will include
            detail as to which parameter failed validation.
      summary: Remove a package from a basket
      tags:
      - Baskets
      x-content-type: application/json
      x-accepts:
      - application/json
    servers:
    - description: "Basket-only API, account token not required"
      url: https://headless.tebex.io/api/baskets
  /{basketIdent}/packages/{packageId}:
    put:
      description: |-
        Sets the quantity of the given item in the basket. The user must be logged in before the quantity can be changed.

        - `{packageId}` accepts the package's `ident` or numeric ID. Using `ident` is recommended, since it works for every package type.
        - Numeric IDs still work for standard packages.
      operationId: updatePackageQuantity
      parameters:
      - $ref: '#/components/parameters/basketIdent'
      - description: The package's `ident` (recommended) or numeric ID.
        explode: false
        in: path
        name: packageId
        required: true
        schema:
          example: pkg_12_456
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updatePackageQuantity_request'
      responses:
        "200":
          description: Successful response.
        "422":
          description: The provided request is invalid. The error response will include
            detail as to which parameter failed validation.
      summary: Update package quantity
      tags:
      - Baskets
      x-content-type: application/json
      x-accepts:
      - application/json
    servers:
    - description: "Basket-only API, account token not required"
      url: https://headless.tebex.io/api/baskets
