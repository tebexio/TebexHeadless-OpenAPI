openapi: 3.1.0
info:
  contact:
    email: tebex-integrations@overwolf.com
  description: "The headless API is designed for implementing your own store frontend\
    \ with the data of your store. You are able to call the Headless API directly\
    \ from a web browser (such as within an SPA), from a backend server, or in-game\
    \ GUIs."
  license:
    name: MIT
    url: https://opensource.org/license/mit
  termsOfService: https://tebex.io/terms-creator-agreement
  title: Tebex Headless API
  version: 2.1.0
servers:
- description: Main API scoped to public token
  url: "https://headless.tebex.io/api/accounts/{token}"
  variables:
    token:
      default: YOUR_PUBLIC_TOKEN
      description: The store's public token
tags:
- description: Main API scoped to public token
  name: Headless
- description: Endpoints requiring only a basket ident with no token
  name: Baskets
paths:
  /:
    get:
      description: Gets the webstore associated with the provided token
      operationId: getWebstore
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebstoreResponse'
          description: Successful response returns the webstore's information.
      summary: Get the webstore's information
      tags:
      - Headless
      x-accepts:
      - application/json
  /pages:
    get:
      description: Gets a list of custom pages associated with the webstore. These
        contain a `content` variable with the HTML content of the page.
      operationId: getCustomPages
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CMSPagesResponse'
          description: Successful response returns the webstore's pages.
      summary: Get custom pages defined for the webstore.
      tags:
      - Headless
      x-accepts:
      - application/json
  /baskets/{basketIdent}:
    get:
      description: Gets a basket associated with the provided identifier.
      operationId: getBasket
      parameters:
      - $ref: '#/components/parameters/basketIdent'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasketResponse'
          description: Successful response returns the basket information.
      summary: Get a basket
      tags:
      - Headless
      x-accepts:
      - application/json
  /baskets:
    post:
      description: Creates a new basket for use during checkout.
      operationId: createBasket
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createBasket_request'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasketResponse'
          description: Successful response returns the basket information.
        "422":
          description: The provided webstore ID is invalid.
      summary: Create a new basket
      tags:
      - Headless
      x-content-type: application/json
      x-accepts:
      - application/json
  /baskets/{basketIdent}/auth?returnUrl={returnUrl}:
    get:
      description: |-
        Fetches a basket's auth URL. The player should be directed here in order for them to authorize their account.
        When complete, they will be returned to the provided `returnUrl` and the basket will be authorized from that moment onwards.
      operationId: getBasketAuthUrl
      parameters:
      - $ref: '#/components/parameters/basketIdent'
      - description: The URL you would like to redirect the user to after successful
          basket authentication.
        explode: false
        in: path
        name: returnUrl
        required: true
        schema:
          example: https://example.tebex.io/
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasketAuthResponse'
          description: Successful response returns the auth provider options and URLs
            of the sign-in link.
        "422":
          description: The provided webstore ID or basket ID is invalid.
      summary: Get auth links for basket
      tags:
      - Headless
      x-accepts:
      - application/json
  /baskets/{basketIdent}/dynamic-packages:
    put:
      description: |-
        Populates a dynamic category with custom packages for the given basket. Dynamic categories are created in the creator panel with the type `dynamic`, and are typically populated in response to a `basket.authenticated` webhook.

        Requires basic auth: the username is the webstore identifier and the password is the account's checkout API key.

        Once created, the packages can be fetched using the category endpoints with both `includePackages=1` and `basketIdent` provided.
      operationId: createDynamicPackage
      parameters:
      - $ref: '#/components/parameters/basketIdent'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DynamicPackagesRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicPackagesResponse'
          description: Successful response confirms the dynamic packages were created.
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is invalid. The error response will include detail
            as to which parameter failed validation. This is also returned when basic
            auth credentials are missing ("Basic auth credentials are required") or
            when `category_id` is not a dynamic category ("The specified category
            is not a dynamic category.").
      security:
      - basicAuth: []
      summary: Add packages to a dynamic category for a basket.
      tags:
      - Headless
      x-content-type: application/json
      x-accepts:
      - application/json
  /categories:
    get:
      description: "Gets all categories from a webstore. This does not include package\
        \ information. To include package information, add `?includePackages=1` to\
        \ the URL."
      operationId: getCategories
      responses:
        "200":
          content:
            application/json:
              examples:
                categories:
                  summary: Categories
                  value:
                    data:
                    - id: 2678660
                      name: Packages
                      slug: packages
                      parent: null
                      tiered: false
                      active_tier: null
                      description: <p>Packages category.</p>
                      order: 1
                      display_type: list
                      image_url: null
                      dynamic: false
              schema:
                $ref: '#/components/schemas/CategoryResponse'
          description: Successful response returns a list of category information.
      summary: Get all categories
      tags:
      - Headless
      x-accepts:
      - application/json
  /categories?includePackages=1:
    get:
      description: Gets all categories from a webstore including packages.
      operationId: getCategoriesIncludePackages
      responses:
        "200":
          content:
            application/json:
