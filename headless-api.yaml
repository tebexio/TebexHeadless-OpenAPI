  /{basketIdent}/packages:
   servers:
     - url: https://headless.tebex.io/api/baskets
       description: Basket-only API, account token not required
   post:
    tags:
    - Baskets
    operationId: addBasketPackage
    summary: Add package to basket
    parameters:
      - $ref: "#/components/parameters/basketIdent"
    description: |-
        Add a package to the basket by its `ident` or numeric ID.

        - Using `ident` is recommended, since it works for every package type. It is required for external packages.
        - Numeric IDs still work for standard packages.

        To add a package belonging to a dynamic category, set `dynamic` to `true`. Without this property the API will treat the request as a normal package ID.
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required:
              - package_id
              - quantity
            properties:
              package_id:
                type: string
                example: pkg_12_456
                description: The package's `ident` (recommended) or numeric ID. `ident` is required for external packages. Send the `ident` exactly as returned by the package endpoints.
              quantity:
                type: integer
                example: 1
              dynamic:
                type: boolean
                example: false
                description: Set to `true` when adding a package that belongs to a dynamic category. When omitted, the API acts as if a normal package ID was provided.
    responses:
      '200':
        description: |- 
          Successful response.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasketResponse'
      '400':
        description: |-
          The ident is unknown or does not match a package in this store ("The selected id is invalid.").
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '422':
        description: The provided request is invalid. The error response will include detail as to which parameter failed validation. A malformed `package_id` fails with "package_id must be a package ID or ident."
  /{basketIdent}/packages/remove:
    servers:
      - url: https://headless.tebex.io/api/baskets
        description: Basket-only API, account token not required
    post:
      tags:
      - Baskets
      operationId: removeBasketPackage
      summary: Remove a package from a basket
      parameters:
        - $ref: "#/components/parameters/basketIdent"
      description: |- 
          Remove a package from the basket by its `ident` or numeric ID.

          - Using `ident` is recommended, since it works for every package type. Send it back exactly as returned; don't build or parse it.
          - Numeric IDs still work for standard packages.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                package_id: 
                  type: string
                  example: pkg_12_456
                  description: The package's `ident` (recommended) or numeric ID.
      responses:
        '200':
          description: |- 
            Successful response returns the basket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasketResponse'
        '422':
          description: The provided request is invalid. The error response will include detail as to which parameter failed validation.
  /{basketIdent}/packages/{packageId}:
    servers:
      - url: https://headless.tebex.io/api/baskets
        description: Basket-only API, account token not required
    put:
      tags:
      - Baskets
      operationId: updatePackageQuantity
      summary: Update package quantity
      parameters:
        - $ref: "#/components/parameters/basketIdent"
        - in: path
          name: packageId
          required: true
          schema:
            type: string
            example: pkg_12_456
          description: The package's `ident` (recommended) or numeric ID.
      description: |- 
          Sets the quantity of the given item in the basket. The user must be logged in before the quantity can be changed.

          - `{packageId}` accepts the package's `ident` or numeric ID. Using `ident` is recommended, since it works for every package type.
          - Numeric IDs still work for standard packages.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
                  example: 1
      responses:
        '200':
          description: |- 
            Successful response.
        '422':
          description: The provided request is invalid. The error response will include detail as to which parameter failed validation.
