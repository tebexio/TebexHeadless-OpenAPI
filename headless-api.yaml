    SalesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          description: Active sales, in control panel order. Empty when there are none.
          items:
            $ref: '#/components/schemas/Sale'

    Sale:
      type: object
      required: [id, name, starts_at, ends_at, discount, applies_to, requirements]
      properties:
        id:
          type: integer
          example: 14
        name:
          type: string
          example: Summer Sale
        starts_at:
          type: string
          format: date-time
          description: Start of the sale, ISO 8601 in UTC.
          example: "2026-10-04T13:59:09+00:00"
        ends_at:
          type: string
          format: date-time
          description: End of the sale, ISO 8601 in UTC.
          example: "2026-10-19T13:59:09+00:00"
        discount:
          $ref: '#/components/schemas/SaleDiscount'
        applies_to:
          $ref: '#/components/schemas/SaleAppliesTo'
        requirements:
          type: array
          description: Conditions a customer must meet for the sale to apply. Empty when the sale has none. `minimum_basket_value` can appear alongside `purchased_packages` or `lifetime_spend`.
          items:
            $ref: '#/components/schemas/SaleRequirement'

    SaleDiscount:
      type: object
      required: [type, percentage, amount, currency]
      properties:
        type:
          type: string
          enum: [percentage, amount, commands]
          example: percentage
        percentage:
          type:
            - 'null'
            - number
          description: Set only when `type` is `percentage`, otherwise null.
          example: 20
        amount:
          type:
            - 'null'
            - number
          description: Set only when `type` is `amount`, otherwise null.
          example: null
        currency:
          type: string
          description: The store currency.
          example: USD

    SaleAppliesTo:
      type: object
      description: |-
        What the sale applies to. Only the array matching `type` is filled; the others are empty. When `type` is `all`, only `excluded_packages` may be filled.
      required: [type, packages, categories, variable_options, excluded_packages]
      properties:
        type:
          type: string
          enum: [all, package, category, variable_option]
          example: all
        packages:
          type: array
          description: Filled when `type` is `package`.
          items:
            $ref: '#/components/schemas/SaleReference'
        categories:
          type: array
          description: Filled when `type` is `category`.
          items:
            $ref: '#/components/schemas/SaleReference'
        variable_options:
          type: array
          description: Filled when `type` is `variable_option`.
          items:
            $ref: '#/components/schemas/SaleReference'
        excluded_packages:
          type: array
          description: Packages excluded from the sale. Filled only when `type` is `all`.
          items:
            $ref: '#/components/schemas/SaleReference'

    SaleReference:
      type: object
      description: A package, category or variable option referenced by a sale.
      required: [id, name]
      properties:
        id:
          type: integer
          example: 28
        name:
          type: string
          example: GIFTCARD

    SaleRequirement:
      type: object
      description: |-
        A condition for the sale. Fields present depend on `type`:
        - `purchased_packages`: `packages` and `match` (always `all`). `packages` is empty if every required package is hidden.
        - `lifetime_spend`: `amount` and `currency`.
        - `minimum_basket_value`: `amount` and `currency`.
      required: [type]
      properties:
        type:
          type: string
          enum: [purchased_packages, lifetime_spend, minimum_basket_value]
          example: lifetime_spend
          description: The type of requirement for the sale. Additional requirement types may be added later. Clients must ignore requirement types they do not know.
        packages:
          type: array
          description: Packages the customer must have purchased. Present for `purchased_packages`.
          items:
            $ref: '#/components/schemas/SaleReference'
        match:
          type: string
          enum: [all]
          description: Present for `purchased_packages`. Always `all`.
        amount:
          type: number
          description: Present for `lifetime_spend` and `minimum_basket_value`.
          example: 50
        currency:
          type: string
          description: Present for `lifetime_spend` and `minimum_basket_value`. The store currency.
          example: USD

    RecentPaymentsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          description: Recent payments, newest first. Empty when there are none.
          items:
            $ref: '#/components/schemas/RecentPaymentEntry'

    RecentPaymentEntry:
      type: object
      required: [id, username, username_id, avatar_url, package_name, created_at, price, currency]
      properties:
        id:
          type: integer
          example: 2728
        username:
          type: string
          example: "12345"
        username_id:
          type: string
          example: "6379162"
        avatar_url:
          type: string
          format: uri
          example: https://avatars.discourse-cdn.com/v4/letter/1/ec9cab/256.png
        package_name:
          type: string
          description: The first package on the payment. If the payment holds more, it is suffixed, e.g. "+ 1 more".
          example: This is another package + 1 more
        created_at:
          type: string
          format: date-time
          example: "2026-09-17T07:15:49+00:00"
        price:
          type: number
          example: 2.99
        currency:
          type: string
          example: USD

    TopCustomerResponse:
      type: object
      required: [data]
      properties:
        data:
          description: The top customer, or null when there is none for the period.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/TopCustomer'

    TopCustomer:
      type: object
      required: [username, username_id, avatar_url, total, currency, period]
      properties:
        username:
          type: string
          example: George_Peel
        username_id:
          type: string
          example: "15413447"
        avatar_url:
          type: string
          format: uri
          example: https://forum.cfx.re/user_avatar/forum.cfx.re/george_peel/256/4582854_2.png
        total:
          type: number
          description: Amount spent in the period, in the account's currency, net of tax.
          example: 21.99
        currency:
          type: string
          example: USD
        period:
          type: string
          enum: [hourly, daily, weekly, monthly, yearly, none]
          description: The period requested.
          example: monthly

    CommunityGoalsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          description: Community goals. Empty when none match.
          items:
            $ref: '#/components/schemas/CommunityGoal'

    CommunityGoalResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CommunityGoal'

    CommunityGoal:
      type: object
      required: [id, name, description, image_url, target, current, currency, percentage, repeatable, times_achieved, last_achieved, status, created_at, updated_at]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: New Server
        description:
          type: string
          example: Fund a second server
        image_url:
          type:
            - 'null'
            - string
          format: uri
          example: null
        target:
          type: number
          description: The goal amount, in `currency`.
          example: 1000
        current:
          type: number
          description: The amount raised so far, in `currency`.
          example: 630
        currency:
          type: string
          description: The account currency.
          example: USD
        percentage:
          type: number
          example: 63
        repeatable:
          type: boolean
          example: false
        times_achieved:
          type: integer
          example: 0
        last_achieved:
          type:
            - 'null'
            - string
          format: date-time
          example: null
        status:
          type: string
          enum: [active, completed, disabled]
          example: active
        created_at:
          type: string
          format: date-time
          example: "2026-09-17T11:44:46+00:00"
        updated_at:
          type: string
          format: date-time
          example: "2026-09-17T11:44:46+00:00"
