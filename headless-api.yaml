        packages:
          type: array
          description: Packages within the category. For dynamic categories, packages use the `DynamicPackage` shape and are only populated when a `basketIdent` is provided.
          items:
            $ref: "#/components/schemas/Package"
#            anyOf:
#              - $ref: "#/components/schemas/Package"
##              - $ref: "#/components/schemas/DynamicPackage"
          nullable: true
        order:
          type: integer
          example: 1
          description: The numeric order in which to display the category.
        display_type:
          type: string
          enum: [list, grid]
          description: How the category should be displayed
        image_url:
          type: string
          format: uri
          nullable: true
          description: URL of the category image, if set.
          example: null
        dynamic:
          type: boolean
          description: True if this is a dynamic category. Dynamic categories are populated with custom packages per-basket using the Add Dynamic Packages endpoint, and their packages can only be fetched by providing a `basketIdent`.
          example: false
    PackageResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Package'
    SinglePackageResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Package'
    Package:
      type: object
      properties:
        id:
          type: integer
          example: 6276316
          description: The package's numeric ID. For external packages this is synthetic; use `ident` instead.
        name:
          type: string
          example: 'test package 101'
        description:
          type: string
          example: '<p>this is just a test. only a test. nothing more.</p>'
        image:
          type: string
          nullable: true
          example: null
        type:
          type: string
          example: 'single'
        category:
          type: object
          properties:
            id:
              type: integer
              example: 2678660
            name:
              type: string
              example: 'Packages'
        base_price:
          type: number
          format: float
          example: 5
        sales_tax:
          type: number
          format: float
          example: 0
        total_price:
          type: number
          format: float
          example: 5
        currency:
          type: string
          example: 'USD'
        prorate_price:
          type: number
          format: float
          description: If this package is part of a tiered category, this is the difference on upgrade pricing from the current active tier.
          nullable: true
        discount:
          type: number
          format: float
          example: 0
        disable_quantity:
          type: boolean
          example: false
        disable_gifting:
          type: boolean
          example: false
        expiration_date:
          type: string
          nullable: true
          format: date-time
          example: null
        media:
          type: array
          items:
            $ref: '#/components/schemas/PackageMedia'
        order:
          type: integer
        slug:
          type: string
        user_limit:
          type: integer
        creator_meta_data:
          type: object
        options:
          type: array
        variables:
          type: array
        created_at:
          type: string
          format: date-time
          example: '2024-05-21T18:09:17+00:00'
        updated_at:
          type: string
          format: date-time
          example: '2024-05-21T18:09:17+00:00'
        ident:
          type: string
          example: pkg_12_456
          description: |-
            The package's string identifier, returned on every package (standard, dynamic and external). Treat it as an opaque string: store it and send it back as-is to `getPackage` and `addBasketPackage`; don't build or parse it.

            It has the form `{prefix}_{categoryId}_{id}`, where `prefix` is `pkg` (standard), `dyn` (dynamic, numeric id) or `ext` (external, e.g. `ext_10_{asset-uuid}` for INTRACT, with the provider's identifier URL-encoded).
        vip_status:
          type: string
          nullable: true
          example: null
          description: The package's VIP status. Only `null` has been observed so far, so the non-null type is unconfirmed.
    BasketPackage:
      type: object
      description: A package within an existing basket.
      properties:
        id:
          type: integer
          description: The package ID
        description:
          type: string
          example: "100 coins added to your character"
        image:
          type: string
          example: "https://tebex.io/path/to/image.png"
        name:
          type: string
          example: "100 Coins"
        slug:
          type: string
          example: "100-coins"
        in_basket:
          type: object
          properties:
            quantity:
              type: integer
              description: The quantity of `package` in this basket. This is not the total quantity of overall items in the basket.
              example: 2
            price:
              type: number
              format: float
            gift_username_id:
              type: string
              description: The username id of the user this package is gifted to
            gift_username:
              type: string
              description: The username of the user this package is gifted to.
        type:
          type: string
          enum: [single,subscription]
          example: single
          description: The type of payment, either `single` for one-time payments or `subscription`.
        revenue_share:
          type: array
          description: An array of payment destination objects describing how the purchase should be split between multiple wallets. **Only available with pre-agreement from Tebex.**
          items:
            $ref: '#/components/schemas/RevenueShare'
        is_recurring:
          type: boolean
          example: false
          description: Whether this package is a recurring (subscription) purchase.
    RevenueShare:
      type: object
      properties:
        wallet_ref:
          type: string
          example: some_wallet_reference
        amount:
          type: number
          example: 0.50
          description: A float (decimal) value representing the amount of this payment in your account currency that is credited to the `wallet_ref`
        gateway_fee_percent:
          type: number
          example: 50.00
          description: A float (decimal) value representing the percentage of the gateway fee that should be dedicated from this wallet’s revenue share. This optional value can be anywhere between 0 - 100.
    Tier:
      type: object
      properties:
        id:
          type: integer
          example: 40796
        created_at:
          type: string
          format: date-time
          description: The date and time when the tier became active
          example: "2025-05-14T13:48:56.000000Z"
        username_id:
          type: string
          description: The user's username ID. For Steam, this is a numeric representation of their Steam64ID
        package:
          $ref: '#/components/schemas/Package'
        active:
          type: boolean
          description: True if the tier is currently active.
          example: true
        recurring_payment_reference:
          type: string
          description: The ID of the recurring payment this tier is attached to.
          example: tbx-r-757925142
        next_payment_date:
          type: string
          format: date-time
          description: The date and time of the next payment for this tier.
          example: "2025-06-14T13:48:56+00:00"
        status:
          type: object
          properties:
            id:
              type: integer
              example: 2
            description:
              type: string
              example: Active
        pending_downgrade_package:
          type: object
          properties:
            id:
              type: integer
              example: 6834820
            name:
              type: string
              example: Bronze
          description: The package this tier is downgrading to if a downgrade is pending.
          nullable: true
    
    PackageMedia:
      properties:
        type:
          type: string
          enum: [video, image]
